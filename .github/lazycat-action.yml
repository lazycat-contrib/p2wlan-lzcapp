version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  sync_homepage: true
  sync_license: true
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: control

images:
  - id: control
    target: service
    service: control
    source: ghcr.io/yhan-sun/p2wlan/server
    channel: custom
    sort: semver
    tag_regex: '^server-v0\.1\.1[7-9][0-9]$'
    version_regex: '^server-v(?P<version>0\.1\.1[7-9][0-9])$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true

build:
  run_buildscript: false
  toolchains: []

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: P2WLAN Server
